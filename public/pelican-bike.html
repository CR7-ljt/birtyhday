<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>骑自行车的鹈鹕 - 2D矢量动画</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:linear-gradient(180deg,#87CEEB 0%,#E0F6FF 50%,#98FB98 100%);
  font-family:'Comic Sans MS',cursive,sans-serif;overflow:hidden
}
h1{
  color:#FF6B35;text-shadow:2px 2px 0 #fff,-1px -1px 0 #fff;
  margin-bottom:16px;font-size:1.8rem;animation:bounce 1s ease-in-out infinite;
  z-index:10
}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.scene{width:800px;height:500px;margin:0 auto;border-radius:16px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.12)}
svg{width:100%;height:100%;display:block}
@keyframes wheelSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.wheel{animation:wheelSpin .8s linear infinite;transform-origin:0 0}
@keyframes pedalPush{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.pedals{animation:pedalPush 1.6s linear infinite;transform-origin:0 0}
@keyframes wingBalance{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.wing-left{animation:wingBalance .6s ease-in-out infinite;transform-origin:0 0}
.wing-right{animation:wingBalance .6s ease-in-out infinite reverse;transform-origin:0 0}
@keyframes beakOpen{0%,40%,100%{transform:scaleY(1)}20%{transform:scaleY(.25)}}
.beak-lower{animation:beakOpen 1.5s ease-in-out infinite;transform-origin:0 -4}
@keyframes bodyBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.pelican-body{animation:bodyBounce .4s ease-in-out infinite}
@keyframes cloudFloat{0%{transform:translateX(-140px)}100%{transform:translateX(940px)}}
.cloud1{animation:cloudFloat 16s linear infinite}
.cloud2{animation:cloudFloat 20s linear infinite;animation-delay:-7s}
.cloud3{animation:cloudFloat 24s linear infinite;animation-delay:-13s}
@keyframes blink{0%,45%,55%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
.eye-blink{animation:blink 2.5s ease-in-out infinite;transform-origin:0 0}
@keyframes pouchPulse{0%,100%{transform:scaleX(1) scaleY(1)}50%{transform:scaleX(1.06) scaleY(1.1)}}
.pouch-pulse{animation:pouchPulse 1.5s ease-in-out infinite;transform-origin:0 0}
@keyframes sunGlow{0%,100%{r:45;opacity:.85}50%{r:52;opacity:1}}
@keyframes flowerSway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.flower{animation:flowerSway 2s ease-in-out infinite;transform-origin:0 0}
@keyframes tailWag{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.tail{animation:tailWag .5s ease-in-out infinite;transform-origin:0 0}
.credit{margin-top:16px;color:#666;font-size:.85rem;text-shadow:0 1px 2px rgba(255,255,255,.8)}
</style>
</head>
<body>
<h1>🚲 可爱鹈鹕骑自行车 🦢</h1>
<div class="scene">
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" style="stop-color:#87CEEB"/>
<stop offset="60%" style="stop-color:#E0F6FF"/>
<stop offset="100%" style="stop-color:#98FB98"/>
</linearGradient>
<linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FF69B4"/>
<stop offset="50%" style="stop-color:#FF1493"/>
<stop offset="100%" style="stop-color:#FF69B4"/>
</linearGradient>
<linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#00CED1"/>
<stop offset="30%" style="stop-color:#FFD700"/>
<stop offset="60%" style="stop-color:#FF6347"/>
<stop offset="100%" style="stop-color:#9370DB"/>
</linearGradient>
<radialGradient id="bodyGrad" cx="50%" cy="45%" r="55%">
<stop offset="0%" style="stop-color:#FFFFFF"/>
<stop offset="60%" style="stop-color:#FAFAFA"/>
<stop offset="100%" style="stop-color:#E0E0E0"/>
</radialGradient>
<radialGradient id="beakGrad" cx="30%" cy="30%" r="70%">
<stop offset="0%" style="stop-color:#FFB347"/>
<stop offset="100%" style="stop-color:#FF8C00"/>
</radialGradient>
<radialGradient id="pouchGrad" cx="50%" cy="30%" r="70%">
<stop offset="0%" style="stop-color:#FFD27F"/>
<stop offset="100%" style="stop-color:#FF8C00"/>
</radialGradient>
</defs>

<!-- 天空与地面 -->
<rect x="0" y="0" width="800" height="500" fill="url(#skyGrad)"/>
<rect x="0" y="395" width="800" height="105" fill="#90EE90"/>
<ellipse cx="400" cy="395" rx="460" ry="18" fill="#7CCD7C"/>
<!-- 地面纹理线 -->
<line x1="0" y1="430" x2="800" y2="430" stroke="#6BBE6B" stroke-width="2" stroke-dasharray="30 20" opacity="0.5"/>
<line x1="0" y1="460" x2="800" y2="460" stroke="#6BBE6B" stroke-width="1.5" stroke-dasharray="20 30" opacity="0.4"/>

<!-- 云朵 -->
<g class="cloud1">
<ellipse cx="100" cy="75" rx="55" ry="25" fill="white" opacity=".92"/>
<ellipse cx="135" cy="65" rx="42" ry="20" fill="white" opacity=".92"/>
<ellipse cx="70" cy="70" rx="35" ry="18" fill="white" opacity=".92"/>
<ellipse cx="105" cy="60" rx="30" ry="15" fill="white" opacity=".9"/>
</g>
<g class="cloud2">
<ellipse cx="320" cy="110" rx="60" ry="28" fill="white" opacity=".82"/>
<ellipse cx="365" cy="100" rx="45" ry="22" fill="white" opacity=".82"/>
<ellipse cx="280" cy="105" rx="38" ry="20" fill="white" opacity=".82"/>
<ellipse cx="330" cy="95" rx="32" ry="16" fill="white" opacity=".78"/>
</g>
<g class="cloud3">
<ellipse cx="600" cy="55" rx="50" ry="24" fill="white" opacity=".88"/>
<ellipse cx="635" cy="48" rx="38" ry="18" fill="white" opacity=".88"/>
<ellipse cx="570" cy="52" rx="32" ry="16" fill="white" opacity=".88"/>
</g>

<!-- 太阳 -->
<circle cx="710" cy="75" r="45" fill="#FFD700" opacity=".88"/>
<circle cx="710" cy="75" r="35" fill="#FFF8DC"/>
<!-- 太阳光芒 -->
<g opacity=".3" fill="#FFD700">
<polygon points="710,15 708,30 712,30"/>
<polygon points="710,135 708,120 712,120"/>
<polygon points="650,75 665,73 665,77"/>
<polygon points="770,75 755,73 755,77"/>
<polygon points="668,33 678,43 673,46"/>
<polygon points="752,117 742,107 747,104"/>
<polygon points="668,117 678,107 673,104"/>
<polygon points="752,33 742,43 747,46"/>
</g>

<!-- ===== 自行车 ===== -->
<!-- 自行车整体偏移到场景中央偏下 -->
<g transform="translate(0,0)">

<!-- 后轮 -->
<g transform="translate(260,355)">
  <g class="wheel">
    <circle cx="0" cy="0" r="55" fill="none" stroke="url(#wheelGrad)" stroke-width="7"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#FF69B4" stroke-width="1.5"/>
    <line x1="0" y1="-48" x2="0" y2="48" stroke="#FFB6C1" stroke-width="2"/>
    <line x1="-48" y1="0" x2="48" y2="0" stroke="#FFB6C1" stroke-width="2"/>
    <line x1="-34" y1="-34" x2="34" y2="34" stroke="#FFB6C1" stroke-width="2"/>
    <line x1="34" y1="-34" x2="-34" y2="34" stroke="#FFB6C1" stroke-width="2"/>
    <line x1="-18" y1="-44" x2="18" y2="44" stroke="#FFB6C1" stroke-width="1.2" opacity=".5"/>
    <line x1="18" y1="-44" x2="-18" y2="44" stroke="#FFB6C1" stroke-width="1.2" opacity=".5"/>
    <!-- 车轮装饰点 -->
    <circle cx="0" cy="-44" r="3" fill="#FF1493"/>
    <circle cx="44" cy="0" r="3" fill="#FF1493"/>
    <circle cx="0" cy="44" r="3" fill="#FF1493"/>
    <circle cx="-44" cy="0" r="3" fill="#FF1493"/>
  </g>
  <circle cx="0" cy="0" r="9" fill="#444"/>
  <circle cx="0" cy="0" r="4" fill="#FF0"/>
</g>

<!-- 前轮 -->
<g transform="translate(480,355)">
  <g class="wheel">
    <circle cx="0" cy="0" r="55" fill="none" stroke="url(#wheelGrad)" stroke-width="7"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#FF69B4" stroke-width="1.5"/>
    <line x1="0" y1="-48" x2="0" y2="48" stroke="#FFB6C1" stroke-width="2"/>
    <line x1="-48" y1="0" x2="48" y2="0" stroke="#FFB6C1" stroke-width="2"/>
    <line x1="-34" y1="-34" x2="34" y2="34" stroke="#FFB6C1" stroke-width="2"/>
    <line x1="34" y1="-34" x2="-34" y2="34" stroke="#FFB6C1" stroke-width="2"/>
    <line x1="-18" y1="-44" x2="18" y2="44" stroke="#FFB6C1" stroke-width="1.2" opacity=".5"/>
    <line x1="18" y1="-44" x2="-18" y2="44" stroke="#FFB6C1" stroke-width="1.2" opacity=".5"/>
    <circle cx="0" cy="-44" r="3" fill="#FF1493"/>
    <circle cx="44" cy="0" r="3" fill="#FF1493"/>
    <circle cx="0" cy="44" r="3" fill="#FF1493"/>
    <circle cx="-44" cy="0" r="3" fill="#FF1493"/>
  </g>
  <circle cx="0" cy="0" r="9" fill="#444"/>
  <circle cx="0" cy="0" r="4" fill="#FF0"/>
</g>

<!-- 车架 - 彩虹色 -->
<path d="M260 355 L330 260 L480 355" fill="none" stroke="url(#frameGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M330 260 L480 260 L480 355" fill="none" stroke="url(#frameGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M330 260 L260 355" fill="none" stroke="url(#frameGrad)" stroke-width="6" stroke-linecap="round"/>

<!-- 座管 -->
<path d="M360 295 L390 210 L430 210" fill="none" stroke="url(#frameGrad)" stroke-width="7" stroke-linecap="round"/>
<!-- 座垫 -->
<ellipse cx="410" cy="205" rx="28" ry="8" fill="#8B4513"/>
<ellipse cx="410" cy="202" rx="22" ry="5" fill="#A0522D"/>

<!-- 车把 -->
<path d="M445 220 L470 210 M445 220 L470 230 M450 218 L485 205" fill="none" stroke="#444" stroke-width="5" stroke-linecap="round"/>
<!-- 车把把套 -->
<circle cx="485" cy="205" r="7" fill="#FF6347"/>
<circle cx="470" cy="210" r="6" fill="#00CED1"/>
<circle cx="470" cy="230" r="6" fill="#FFD700"/>

<!-- 链条连接点装饰 -->
<circle cx="360" cy="355" r="6" fill="#FFC107" stroke="#F57F17" stroke-width="1.5"/>

<!-- 五通/中轴 - 踏板系统 -->
<g class="pedals" transform="translate(360,300)">
  <circle cx="0" cy="0" r="7" fill="#444"/>
  <circle cx="0" cy="0" r="3" fill="#888"/>
  <!-- 左踏板臂 + 踏板 -->
  <line x1="0" y1="0" x2="25" y2="18" stroke="#666" stroke-width="5" stroke-linecap="round"/>
  <rect x="20" y="14" width="22" height="8" rx="3" fill="#2196F3"/>
  <rect x="22" y="16" width="18" height="4" rx="2" fill="#42A5F5"/>
  <!-- 右踏板臂 + 踏板 -->
  <line x1="0" y1="0" x2="-25" y2="-18" stroke="#666" stroke-width="5" stroke-linecap="round"/>
  <rect x="-42" y="-22" width="22" height="8" rx="3" fill="#2196F3"/>
  <rect x="-40" y="-20" width="18" height="4" rx="2" fill="#42A5F5"/>
</g>
</g>

<!-- ===== 鹈鹕 ===== -->
<g class="pelican-body" transform="translate(380,170)">

  <!-- 尾巴羽毛 -->
  <g class="tail">
    <path d="M-28 35 Q-55 40 -65 58 Q-48 52 -28 45 Z" fill="#E8E8E8" stroke="#D0D0D0" stroke-width="1"/>
    <path d="M-25 42 Q-50 48 -58 65 Q-42 58 -25 50 Z" fill="#D8D8D8" stroke="#C0C0C0" stroke-width="1"/>
    <path d="M-22 48 Q-42 55 -50 72 Q-36 63 -22 55 Z" fill="#E0E0E0"/>
  </g>

  <!-- 身体 -->
  <ellipse cx="0" cy="30" rx="42" ry="34" fill="url(#bodyGrad)" stroke="#D0D0D0" stroke-width="1.5"/>
  <ellipse cx="0" cy="38" rx="28" ry="22" fill="#FFF8E1" opacity=".7"/>

  <!-- 左翅膀 -->
  <g class="wing-left" transform="translate(-22,18)">
    <path d="M-8 0 Q-55 -12 -75 15 Q-55 22 -35 28 Q-18 24 -8 18 Z" fill="#F5F5F5" stroke="#D0D0D0" stroke-width="1.2"/>
    <path d="M-12 4 Q-45 -2 -65 10" fill="none" stroke="#D8D8D8" stroke-width="2"/>
    <path d="M-8 9 Q-40 6 -58 15" fill="none" stroke="#D8D8D8" stroke-width="1.5"/>
  </g>

  <!-- 右翅膀 -->
  <g class="wing-right" transform="translate(22,18)">
    <path d="M8 0 Q55 -12 75 15 Q55 22 35 28 Q18 24 8 18 Z" fill="#F5F5F5" stroke="#D0D0D0" stroke-width="1.2"/>
    <path d="M12 4 Q45 -2 65 10" fill="none" stroke="#D8D8D8" stroke-width="2"/>
    <path d="M8 9 Q40 6 58 15" fill="none" stroke="#D8D8D8" stroke-width="1.5"/>
  </g>

  <!-- 脖子 -->
  <path d="M10 8 Q15 -18 20 -38 Q25 -55 30 -65" fill="none" stroke="url(#bodyGrad)" stroke-width="16" stroke-linecap="round"/>
  <path d="M10 8 Q15 -18 20 -38 Q25 -55 30 -65" fill="none" stroke="#F5F5F5" stroke-width="12" stroke-linecap="round"/>

  <!-- 头 -->
  <ellipse cx="36" cy="-72" rx="26" ry="22" fill="url(#bodyGrad)" stroke="#D0D0D0" stroke-width="1.2"/>

  <!-- 头顶羽毛簇 -->
  <path d="M20,-94 Q18,-108 24,-114" stroke="#D0D0D0" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M26,-94 Q28,-106 32,-112" stroke="#D8D8D8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M32,-93 Q36,-104 40,-108" stroke="#E0E0E0" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="24" cy="-114" r="1.5" fill="#D0D0D0"/>
  <circle cx="32" cy="-112" r="1.5" fill="#D0D0D0"/>

  <!-- 眼睛 -->
  <g transform="translate(48,-78)">
    <ellipse cx="0" cy="0" rx="10" ry="9" fill="white" stroke="#555" stroke-width="1"/>
    <circle cx="3" cy="0" r="5.5" fill="#2F2F2F"/>
    <circle cx="5" cy="-2" r="2" fill="white"/>
  </g>
  <g class="eye-blink" transform="translate(48,-78)">
    <ellipse cx="0" cy="0" rx="10" ry="9" fill="white" stroke="#555" stroke-width="1"/>
  </g>

  <!-- 眉毛 -->
  <path d="M38,-88 Q48,-92 58,-86" stroke="#555" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- 腮红 -->
  <ellipse cx="30" cy="-68" rx="7" ry="4" fill="#FFAB91" opacity=".6"/>

  <!-- 大嘴巴 - 上颌 -->
  <path d="M52,-66 Q85,-78 118,-62 Q128,-56 122,-50 Q88,-60 52,-56 Z" fill="url(#beakGrad)" stroke="#E07000" stroke-width="1.5"/>
  <path d="M56,-64 Q78,-72 108,-60" fill="none" stroke="#FFCC80" stroke-width="1" opacity=".6"/>
  <!-- 鼻孔 -->
  <ellipse cx="62" cy="-65" rx="2" ry="1.5" fill="#E07000"/>

  <!-- 大嘴巴 - 下颌（动画开合） -->
  <g class="beak-lower" transform="translate(0,0)">
    <path d="M52,-54 Q85,-56 118,-48 Q126,-42 120,-36 Q86,-50 52,-48 Z" fill="url(#beakGrad)" stroke="#E07000" stroke-width="1.5"/>
    <!-- 喉囊/下巴袋子 -->
    <g class="pouch-pulse" transform="translate(62,-38)">
      <path d="M0,0 Q28,18 55,-5 Q38,12 18,18 Q6,12 0,0 Z" fill="url(#pouchGrad)" opacity=".92" stroke="#E07000" stroke-width=".8"/>
      <path d="M5,-2 Q25,12 48,-3" fill="none" stroke="#FFD27F" stroke-width="1" opacity=".5"/>
    </g>
  </g>

  <!-- 左腿 + 蹼足 (踩左踏板) -->
  <g transform="translate(-10,55)">
    <path d="M0 0 Q-8 25 10 48" fill="none" stroke="#FFB74D" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="14" cy="52" rx="12" ry="6" fill="#FFB74D" stroke="#FF9800" stroke-width="1"/>
    <path d="M4,54 L0,60" stroke="#FFB74D" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M10,56 L8,62" stroke="#FFB74D" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M18,56 L16,62" stroke="#FFB74D" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M24,54 L28,58" stroke="#FFB74D" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 右腿 + 蹼足 (踩右踏板) -->
  <g transform="translate(5,55)">
    <path d="M0 0 Q12 25 -5 48" fill="none" stroke="#FFB74D" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="-10" cy="52" rx="12" ry="6" fill="#FFB74D" stroke="#FF9800" stroke-width="1"/>
    <path d="M0,54 L4,60" stroke="#FFB74D" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-6,56 L-4,62" stroke="#FFB74D" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-14,56 L-12,62" stroke="#FFB74D" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-20,54 L-24,58" stroke="#FFB74D" stroke-width="2" stroke-linecap="round"/>
  </g>

</g>

<!-- 地面装饰 - 花朵 -->
<g class="flower" transform="translate(80,408)">
<line x1="0" y1="0" x2="0" y2="-15" stroke="#388E3C" stroke-width="2.5"/>
<circle cx="0" cy="-18" r="5" fill="#FF69B4"/>
<circle cx="0" cy="-18" r="2" fill="#FFFF00"/>
</g>
<g class="flower" transform="translate(140,412);animation-delay:-.5s">
<line x1="0" y1="0" x2="0" y2="-12" stroke="#388E3C" stroke-width="2"/>
<circle cx="0" cy="-14" r="4" fill="#87CEEB"/>
<circle cx="0" cy="-14" r="1.5" fill="#FFFF00"/>
</g>
<g class="flower" transform="translate(680,405);animation-delay:-1s">
<line x1="0" y1="0" x2="0" y2="-16" stroke="#388E3C" stroke-width="2.5"/>
<circle cx="0" cy="-19" r="5.5" fill="#DDA0DD"/>
<circle cx="0" cy="-19" r="2" fill="#FFFF00"/>
</g>
<g class="flower" transform="translate(740,410);animation-delay:-1.5s">
<line x1="0" y1="0" x2="0" y2="-12" stroke="#388E3C" stroke-width="2"/>
<circle cx="0" cy="-14" r="4" fill="#FFA07A"/>
<circle cx="0" cy="-14" r="1.5" fill="#FFFF00"/>
</g>
<g class="flower" transform="translate(50,415);animation-delay:-.8s">
<line x1="0" y1="0" x2="0" y2="-10" stroke="#388E3C" stroke-width="2"/>
<circle cx="0" cy="-12" r="3.5" fill="#9C27B0"/>
<circle cx="0" cy="-12" r="1.5" fill="#FFFF00"/>
</g>

</svg>
</div>
<p class="credit">✨ 鹈鹕骑自行车 · 纯CSS+SVG矢量动画 · 色彩鲜艳 · 循环播放 ✨</p>
</body>
</html>
